          grep -Fq TURBO_V37_NATIVE_PLUS_LINUX_BOOT_OBSERVED "$RUNNER_TEMP/build-v37-amd/runtime-v37-kvm-amd.log"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'v37-amd-runtime.json')
          d=json.load(open(p))
          assert d['result']=='PASS', d
          assert d['linux_boot_marker_observed'] is True, d
          assert d['native_parallel_observed'] is True, d
          print('TURBO_V37_AMD_SVM_LINUX_RUNTIME_PASS')
          PY

      - name: Upload AMD runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-v37-amd-svm-runtime-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/v37-amd-runtime.json
            ${{ runner.temp }}/build-v37-amd/runtime-v37-kvm-amd.log
            ${{ runner.temp }}/build-v37-amd/turbo-kernel.elf
            ${{ runner.temp }}/build-v37-amd/turbo-vmm.elf
            ${{ runner.temp }}/build-v37-amd/turbo-block-device.img
